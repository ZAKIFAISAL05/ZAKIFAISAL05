[[headers]]
for = "/*"

[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"
X-Permitted-Cross-Domain-Policies = "none"
Cross-Origin-Opener-Policy = "same-origin"
Cross-Origin-Resource-Policy = "same-origin"
Strict-Transport-Security = "max-age=31536000; includeSubDomains"
Content-Security-Policy = "default-src 'self';\n      base-uri 'self';\n      object-src 'none';\n      frame-ancestors 'none';\n      form-action 'self';\n      img-src 'self' data: https:;\n      media-src 'self' blob: data:;\n      script-src 'self' 'unsafe-inline' https://unpkg.com https://cdnjs.cloudflare.com;\n      style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com;\n      font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com;\n      connect-src 'self';"

[[headers]]
for = "/admin/*"

[headers.values]
X-Robots-Tag = "noindex, nofollow"
Cache-Control = "no-store, no-cache"

[[headers]]
for = "/tiket/*"

[headers.values]
X-Robots-Tag = "noindex, nofollow"
Cache-Control = "no-store, no-cache"

[[headers]]
for = "/assets/css/*"

[headers.values]
Cache-Control = "public, max-age=86400, stale-while-revalidate=3600"

[[headers]]
for = "/assets/js/*"

[headers.values]
Cache-Control = "public, max-age=86400, stale-while-revalidate=3600"

[[headers]]
for = "/assets/img/*"

[headers.values]
Cache-Control = "public, max-age=604800, immutable"

