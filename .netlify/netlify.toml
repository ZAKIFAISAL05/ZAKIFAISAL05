[[headers]]
for = "/*"

[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"
X-Permitted-Cross-Domain-Policies = "none"
Cross-Origin-Opener-Policy = "same-origin"
Cross-Origin-Resource-Policy = "same-origin"
Strict-Transport-Security = "max-age=31536000; includeSubDomains"
Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; frame-src https://translate.google.com; form-action 'self'; img-src 'self' data: https:; media-src 'self' blob: data:; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdnjs.cloudflare.com https://translate.google.com https://translate.googleapis.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com https://translate.googleapis.com https://translate.google.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; connect-src 'self' https://translate.googleapis.com https://translate.google.com;"
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/admin/*"

[headers.values]
X-Robots-Tag = "noindex, nofollow"
Cache-Control = "no-store, no-cache"

[[headers]]
for = "/tiket/*"

[headers.values]
X-Robots-Tag = "noindex, nofollow"
Cache-Control = "no-store, no-cache"

[[headers]]
for = "/assets/css/*"

[headers.values]
