# ============================================================
#  netlify.toml — Nusabit Studio
#  Build config, headers, redirects, custom error pages
# ============================================================

[build]
  functions = "netlify/functions"
  publish   = "."

[functions]
  node_bundler = "esbuild"

# ── GLOBAL SECURITY HEADERS ──────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"
    X-Permitted-Cross-Domain-Policies = "none"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https:; media-src 'self' blob: data:; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; connect-src 'self';"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store, no-cache"

[[headers]]
  for = "/tiket/*"
  [headers.values]
    X-Robots-Tag  = "noindex, nofollow"
    Cache-Control = "no-store, no-cache"

# ── ASSET CACHING ────────────────────────────────────────────
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=3600"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=3600"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

# ── ERROR PAGE PREVIEW ROUTES ────────────────────────────────
# Catatan:
# - `404.html` di root akan otomatis dipakai Netlify untuk halaman tidak ditemukan.
# - Jangan pakai wildcard `/*` untuk 403/500 karena itu bisa menimpa alur 404 normal.
# - Route di bawah hanya untuk membuka halaman error secara manual saat testing.
[[redirects]]
  from   = "/cs"
  to     = "/cs/index.html"
  status = 200

[[redirects]]
  from   = "/tiket"
  to     = "/tiket/index.html"
  status = 200

[[redirects]]
  from   = "/ticket"
  to     = "/tiket/index.html"
  status = 200

[[redirects]]
  from   = "/ticket/"
  to     = "/tiket/index.html"
  status = 200

[[redirects]]
