# ============================================================
#  netlify.toml — Nusabit Studio
#  Build config, headers, redirects, custom error pages
# ============================================================

[build]
  functions = "netlify/functions"
  publish   = "."

[functions]
  node_bundler = "esbuild"

# ── GLOBAL SECURITY HEADERS ──────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store, no-cache"

[[headers]]
  for = "/tiket/*"
  [headers.values]
    X-Robots-Tag  = "noindex, nofollow"
    Cache-Control = "no-store, no-cache"

# ── ASSET CACHING ────────────────────────────────────────────
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=3600"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=3600"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

# ── ERROR PAGE PREVIEW ROUTES ────────────────────────────────
# Catatan:
# - `404.html` di root akan otomatis dipakai Netlify untuk halaman tidak ditemukan.
# - Jangan pakai wildcard `/*` untuk 403/500 karena itu bisa menimpa alur 404 normal.
# - Route di bawah hanya untuk membuka halaman error secara manual saat testing.
[[redirects]]
  from   = "/403"
  to     = "/errors/403.html"
  status = 200

[[redirects]]
  from   = "/500"
  to     = "/errors/500.html"
  status = 200

[[redirects]]
  from   = "/maintenance"
  to     = "/errors/maintenance.html"
  status = 200

# ── GAME DETAIL PAGES ────────────────────────────────────────
