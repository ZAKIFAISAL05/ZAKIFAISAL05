  <link rel="icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png">

  <!-- Global UI: Loading Screen + Offline Detector -->
  <link rel="stylesheet" href="/assets/css/global-ui.css?v=6b2530c767" />

<script src="https://unpkg.com/feather-icons"></script>
<script>document.addEventListener("DOMContentLoaded",function(){try{feather.replace()}catch(e){}});</script>
</head>
<body>

<!-- ANIMATED BACKGROUND -->
<div class="bg-glow" aria-hidden="true"></div>

<!-- PAGE WRAPPER -->
<div class="page-wrapper">

  <!-- ANNOUNCEMENT BANNER -->
  <div class="announcement-banner" id="announcement-banner" role="alert" aria-live="polite">
    <div class="announcement-inner">
      <span class="announcement-icon"><i data-feather="volume-2"></i></span>
      <div class="announcement-text">
        <strong>Info Pembaruan Sistem Tiket</strong>
        Status tiket diperbarui langsung oleh developer. Halaman ini refresh otomatis setiap 10 detik saat tiket masih aktif.
      </div>
      <button class="announcement-close" id="ann-close" aria-label="Tutup pengumuman"><i data-feather="x"></i></button>
    </div>
  </div>

  <!-- SITE HEADER -->
  <header class="site-header" role="banner">
    <a href="../" class="back-btn" aria-label="Kembali ke halaman utama">←</a>
    <a href="../" class="header-brand">
      <img src="../assets/img/studio_logo.png" alt="Nusabit Studio" class="header-logo">
      <div class="header-info">
        <span class="header-title">Nusabit Studio</span>
        <span class="header-sub">Status Tiket Laporan</span>
      </div>
    </a>
  </header>

  <!-- TICKET CARD (diisi oleh JS) -->
  <main id="ticket-card" class="ticket-card" role="main" aria-live="polite" aria-label="Informasi tiket">
    <div class="state-wrap">
      <div class="spinner"></div>
      <div class="state-title">Memuat tiket...</div>
      <div class="state-msg">Sedang mengambil data dari server</div>
    </div>
  </main>

  <!-- REFRESH HINT -->
  <div class="refresh-hint" id="refresh-hint" style="display:none;" aria-live="polite">
    Halaman ini refresh otomatis setiap 10 detik
  </div>

</div><!-- /page-wrapper -->
